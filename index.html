<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phiên Dịch</title>
<meta name="theme-color" content="#C2302A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phiên Dịch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: máy phiên dịch cầm tay — thanh chọn ngôn ngữ trên, hội thoại giữa, hai nút nói lớn dưới */
:root {
  --bg: #EAF0EF; --surface: #FFFFFF; --ink: #13242A; --muted: #5A6C71; --line: #D3DEDC;
  --vi: #C2302A; --vi-soft: #FBE9E7; --guest: #1E5CA3; --guest-soft: #E5EEF9;
  --warn-bg: #FFF4D6; --warn-ink: #6B4A00;
  --font: "Be Vietnam Pro", "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E191C; --surface: #172629; --ink: #E5EEF0; --muted: #93A5A9; --line: #29393D;
    --vi: #E0544D; --vi-soft: #3A1E1D; --guest: #3F7FD0; --guest-soft: #182B42;
    --warn-bg: #3A3016; --warn-ink: #F3D98C; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; gap: 10px; height: 100%; max-width: 640px; margin: 0 auto; min-height: 0; }

header { display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; flex: 1; }
.brand small { display: block; font-weight: 500; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 0.85rem; cursor: pointer;
}
.icon-btn[aria-pressed="true"] { border-color: var(--guest); color: var(--guest); }

.langbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
}
.lang-fixed { font-weight: 600; color: var(--vi); text-align: center; padding: 10px 4px; }
.slot { min-width: 0; }
.swap-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; width: 44px; height: 44px; font: inherit; font-size: 1.3rem; cursor: pointer; }
.talk.swapped .guest-btn { order: -1; }
.lang-hint { font-size: 0.8rem; color: var(--muted); text-align: center; line-height: 1.4; margin-top: -4px; }
select#otherLang {
  width: 100%; font: inherit; font-weight: 600; color: var(--guest); background: var(--guest-soft);
  border: 0; border-radius: 10px; padding: 10px 8px; text-align: center;
}

.notice {
  background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px;
  font-size: 0.9rem; line-height: 1.4; display: flex; gap: 10px; align-items: flex-start;
}
.notice b { display: block; }
.notice button { margin-left: auto; background: none; border: 0; color: inherit; font: inherit; font-weight: 700; cursor: pointer; padding: 0 4px; }

.speed { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 0.8rem; }
.speed-label { color: var(--muted); }
.speed button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.head-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.photo-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer; }
.photo-btn svg { width: 22px; height: 22px; }
.turn img { max-width: 100%; max-height: 160px; border-radius: 10px; object-fit: cover; align-self: flex-start; }

.mic-card { background: var(--surface); border: 2px solid var(--guest); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; font-size: 0.9rem; line-height: 1.4; }
.mic-card b { display: block; }
.mic-card .btn { flex: 0 0 auto; }

.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.turn { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; max-width: 92%; }
.turn.me { align-self: flex-end; background: var(--vi-soft); }
.turn.guest { align-self: flex-start; background: var(--guest-soft); }
.turn .meta { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.turn .src { color: var(--muted); font-size: 0.92rem; line-height: 1.45; overflow-wrap: anywhere; }
.turn .dst { font-size: 1.25rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.turn.me .dst { color: var(--guest); }
.turn.guest .dst { color: var(--vi); }
.turn .row { display: flex; gap: 8px; }
.turn .speak { margin-left: auto; }
.chip { background: var(--line); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 0.68rem; }
.empty { color: var(--muted); text-align: center; margin: auto; line-height: 1.6; padding: 20px; }

.composer { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.composer.me { border-color: var(--vi); }
.composer.guest { border-color: var(--guest); }
.composer .who { font-size: 0.8rem; font-weight: 600; }
.composer.me .who { color: var(--vi); }
.composer.guest .who { color: var(--guest); }
textarea#input {
  width: 100%; min-height: 72px; resize: none; font: inherit; font-size: 1.05rem; color: var(--ink);
  background: var(--bg); border: 0; border-radius: 10px; padding: 10px;
}
.composer .hint { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
.composer .actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: var(--bg); color: var(--ink); }
.btn:disabled { opacity: 0.5; }

.talk { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.talk button {
  border: 0; border-radius: 20px; padding: 18px 10px; font: inherit; cursor: pointer; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 108px; touch-action: manipulation;
}
.talk .me-btn { background: var(--vi); }
.talk .guest-btn { background: var(--guest); }
.talk .big { font-size: 1.1rem; font-weight: 700; text-align: center; }
.talk .small { font-size: 0.75rem; opacity: 0.9; text-align: center; }
.talk svg { width: 30px; height: 30px; }
.talk button.listening { outline: 4px solid var(--ink); outline-offset: 2px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(0.97); } }
@media (prefers-reduced-motion: reduce) { .talk button.listening { animation: none; } }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--guest); outline-offset: 2px; }

.show {
  position: fixed; inset: 0; background: var(--guest); color: #fff; z-index: 20;
  display: flex; flex-direction: column; justify-content: center; gap: 20px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
}
.show.flip .show-text { transform: rotate(180deg); }
.show-text { font-size: clamp(1.6rem, 7vw, 3rem); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; overflow-y: auto; }
.show .icon-btn { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.4); }
.show .show-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Phiên Dịch<small>Máy phiên dịch bằng giọng nói</small></div>
    <div class="head-btns">
      <button class="icon-btn" id="autoSpeak" aria-pressed="true">Đọc to: Bật</button>
    </div>
  </header>

  <div class="langbar">
    <div class="slot" id="slotL"><div class="lang-fixed" id="viLabel">Tiếng Việt</div></div>
    <button class="swap-btn" id="swapBtn" aria-label="Đổi chiều dịch" title="Đổi chiều dịch">⇄</button>
    <div class="slot" id="slotR"><select id="otherLang" aria-label="Ngôn ngữ của khách"></select></div>
  </div>
  <div class="lang-hint" id="langHint"></div>
  <div class="speed" id="speed" role="group" aria-label="Tốc độ đọc">
    <span class="speed-label">Tốc độ đọc</span>
    <button data-rate="0.6">Rất chậm</button>
    <button data-rate="0.75">Chậm</button>
    <button data-rate="0.9">Vừa</button>
    <button data-rate="1.1">Nhanh</button>
  </div>

  <div class="notice" id="notice" hidden>
    <div><b id="noticeTitle"></b><span id="noticeFix"></span></div>
    <button id="noticeClose" aria-label="Đóng thông báo">✕</button>
  </div>

  <div class="mic-card" id="micCard" hidden>
    <div><b>Cho phép dùng micro</b><span id="micText">App cần micro để nghe bạn và khách nói.</span></div>
    <button class="btn primary" id="micAllow">Cho phép micro</button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="composer" id="composer" hidden>
    <div class="who" id="composerWho"></div>
    <textarea id="input" rows="3" placeholder="Nói hoặc gõ câu cần dịch…"></textarea>
    <div class="hint" id="composerHint"></div>
    <div class="actions">
      <button class="btn ghost" id="cancelBtn">Huỷ</button>
      <button class="btn primary" id="translateBtn">Dịch</button>
    </div>
  </div>

  <div class="talk" id="talk">
    <button class="me-btn" id="meBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="big">Tôi nói</span><span class="small">Tiếng Việt → <span id="meTarget">Anh</span></span>
    </button>
    <button class="guest-btn" id="guestBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="big" id="guestLabel">Speak</span><span class="small"><span id="guestSrc">English</span> → Tiếng Việt</span>
    </button>
  </div>
  <button class="photo-btn" id="photoBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Dịch chữ trong ảnh</span>
  </button>
  <input type="file" id="photoInput" accept="image/*" hidden>
</div>

<div class="show" id="show" hidden>
  <div class="show-text" id="showText"></div>
  <div class="show-actions">
    <button class="icon-btn" id="flipBtn">Xoay chữ</button>
    <button class="icon-btn" id="showSpeak">Đọc lại</button>
    <button class="icon-btn" id="showClose">Đóng</button>
  </div>
</div>

<script>
// code: mã giọng nói/đọc; tr: mã dùng cho dịch
const LANGS = [
  { code: "en-GB", tr: "en", vi: "Tiếng Anh (Anh)", name: "English UK", speak: "Speak" },
  { code: "zh-CN", tr: "zh-CN", vi: "Tiếng Trung", name: "中文", speak: "请说" },
  { code: "ja-JP", tr: "ja", vi: "Tiếng Nhật", name: "日本語", speak: "話す" },
  { code: "ko-KR", tr: "ko", vi: "Tiếng Hàn", name: "한국어", speak: "말하기" },
  { code: "th-TH", tr: "th", vi: "Tiếng Thái", name: "ไทย", speak: "พูด" },
  { code: "lo-LA", tr: "lo", vi: "Tiếng Lào", name: "ລາວ", speak: "ເວົ້າ" },
  { code: "km-KH", tr: "km", vi: "Tiếng Khmer", name: "ខ្មែរ", speak: "និយាយ" },
  { code: "fr-FR", tr: "fr", vi: "Tiếng Pháp", name: "Français", speak: "Parler" },
  { code: "de-DE", tr: "de", vi: "Tiếng Đức", name: "Deutsch", speak: "Sprechen" },
  { code: "es-ES", tr: "es", vi: "Tiếng Tây Ban Nha", name: "Español", speak: "Hablar" },
  { code: "ru-RU", tr: "ru", vi: "Tiếng Nga", name: "Русский", speak: "Говорить" },
  { code: "it-IT", tr: "it", vi: "Tiếng Ý", name: "Italiano", speak: "Parla" },
  { code: "pt-BR", tr: "pt", vi: "Tiếng Bồ Đào Nha", name: "Português", speak: "Falar" },
  { code: "id-ID", tr: "id", vi: "Tiếng Indonesia", name: "Bahasa Indonesia", speak: "Bicara" },
  { code: "ms-MY", tr: "ms", vi: "Tiếng Mã Lai", name: "Bahasa Melayu", speak: "Cakap" },
  { code: "fil-PH", tr: "tl", vi: "Tiếng Philippines", name: "Filipino", speak: "Magsalita" },
  { code: "hi-IN", tr: "hi", vi: "Tiếng Hindi", name: "हिन्दी", speak: "बोलें" },
  { code: "ar-SA", tr: "ar", vi: "Tiếng Ả Rập", name: "العربية", speak: "تحدث" },
  { code: "zh-TW", tr: "zh-TW", vi: "Tiếng Trung (phồn thể)", name: "繁體中文", speak: "請說" },
  { more: true, code: "en-US", tr: "en", vi: "Tiếng Anh (Mỹ)", name: "English US", speak: "Speak" },
  { more: true, code: "zh-HK", tr: "yue", vi: "Tiếng Quảng Đông", name: "粵語", speak: "講嘢" },
  { more: true, code: "my-MM", tr: "my", vi: "Tiếng Myanmar", name: "မြန်မာ" },
  { more: true, code: "bn-BD", tr: "bn", vi: "Tiếng Bengal", name: "বাংলা" },
  { more: true, code: "ur-PK", tr: "ur", vi: "Tiếng Urdu", name: "اردو" },
  { more: true, code: "ta-IN", tr: "ta", vi: "Tiếng Tamil", name: "தமிழ்" },
  { more: true, code: "te-IN", tr: "te", vi: "Tiếng Telugu", name: "తెలుగు" },
  { more: true, code: "pa-IN", tr: "pa", vi: "Tiếng Punjab", name: "ਪੰਜਾਬੀ" },
  { more: true, code: "si-LK", tr: "si", vi: "Tiếng Sinhala", name: "සිංහල" },
  { more: true, code: "ne-NP", tr: "ne", vi: "Tiếng Nepal", name: "नेपाली" },
  { more: true, code: "mn-MN", tr: "mn", vi: "Tiếng Mông Cổ", name: "Монгол" },
  { more: true, code: "kk-KZ", tr: "kk", vi: "Tiếng Kazakh", name: "Қазақ" },
  { more: true, code: "uz-UZ", tr: "uz", vi: "Tiếng Uzbek", name: "Oʻzbek" },
  { more: true, code: "tr-TR", tr: "tr", vi: "Tiếng Thổ Nhĩ Kỳ", name: "Türkçe", speak: "Konuş" },
  { more: true, code: "fa-IR", tr: "fa", vi: "Tiếng Ba Tư", name: "فارسی" },
  { more: true, code: "he-IL", tr: "iw", vi: "Tiếng Do Thái", name: "עברית" },
  { more: true, code: "az-AZ", tr: "az", vi: "Tiếng Azerbaijan", name: "Azərbaycan" },
  { more: true, code: "ka-GE", tr: "ka", vi: "Tiếng Gruzia", name: "ქართული" },
  { more: true, code: "hy-AM", tr: "hy", vi: "Tiếng Armenia", name: "Հայերեն" },
  { more: true, code: "nl-NL", tr: "nl", vi: "Tiếng Hà Lan", name: "Nederlands", speak: "Spreken" },
  { more: true, code: "pl-PL", tr: "pl", vi: "Tiếng Ba Lan", name: "Polski", speak: "Mów" },
  { more: true, code: "uk-UA", tr: "uk", vi: "Tiếng Ukraina", name: "Українська", speak: "Говоріть" },
  { more: true, code: "cs-CZ", tr: "cs", vi: "Tiếng Séc", name: "Čeština", speak: "Mluvit" },
  { more: true, code: "sk-SK", tr: "sk", vi: "Tiếng Slovakia", name: "Slovenčina" },
  { more: true, code: "hu-HU", tr: "hu", vi: "Tiếng Hungary", name: "Magyar" },
  { more: true, code: "ro-RO", tr: "ro", vi: "Tiếng Romania", name: "Română" },
  { more: true, code: "bg-BG", tr: "bg", vi: "Tiếng Bulgaria", name: "Български" },
  { more: true, code: "sr-RS", tr: "sr", vi: "Tiếng Serbia", name: "Српски" },
  { more: true, code: "hr-HR", tr: "hr", vi: "Tiếng Croatia", name: "Hrvatski" },
  { more: true, code: "el-GR", tr: "el", vi: "Tiếng Hy Lạp", name: "Ελληνικά" },
  { more: true, code: "sv-SE", tr: "sv", vi: "Tiếng Thuỵ Điển", name: "Svenska", speak: "Tala" },
  { more: true, code: "nb-NO", tr: "no", vi: "Tiếng Na Uy", name: "Norsk", speak: "Snakk" },
  { more: true, code: "da-DK", tr: "da", vi: "Tiếng Đan Mạch", name: "Dansk", speak: "Tal" },
  { more: true, code: "fi-FI", tr: "fi", vi: "Tiếng Phần Lan", name: "Suomi", speak: "Puhu" },
  { more: true, code: "sw-KE", tr: "sw", vi: "Tiếng Swahili", name: "Kiswahili" },
];
const VI = { code: "vi-VN", tr: "vi", vi: "Tiếng Việt", name: "Tiếng Việt" };

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let other = LANGS.find(l => l.code === store.get("pd-lang2", "en-GB")) || LANGS[0];
let autoSpeak = store.get("pd-auto", "1") === "1";
let side = null;
let micBlocked = false;
let recog = null;
let busy = false;
let lastShown = null;
const turns = [];

// ---------- Thông báo lỗi: tiếng Việt, ngắn gọn, kèm cách xử lý ----------
const ERR = {
  empty:        ["Chưa có câu nào để dịch.", " Bấm nút nói rồi nói, hoặc gõ câu vào ô."],
  offline:      ["Mất kết nối mạng.", " Kiểm tra Wi‑Fi hoặc 4G rồi bấm Dịch lại."],
  translate:    ["Chưa dịch được.", " Kiểm tra mạng rồi bấm Dịch lại. Nếu vẫn lỗi, chờ 1 phút rồi thử lại."],
  micDenied:    ["Chưa cho phép dùng micro.", " Bấm biểu tượng ổ khoá cạnh địa chỉ web › Quyền › bật Micro, rồi thử lại."],
  micNone:      ["Máy không nghe được giọng nói.", " Bấm biểu tượng micro trên bàn phím để nói, rồi bấm Dịch."],
  micNoSpeech:  ["Không nghe thấy tiếng nói.", " Nói to, gần điện thoại hơn rồi bấm nút nói lại."],
  micNoLang:    ["Máy chưa nghe được thứ tiếng này.", " Bấm micro trên bàn phím để nói, hoặc gõ chữ."],
  micOther:     ["Micro gặp lỗi.", " Bấm nút nói lại, hoặc dùng micro trên bàn phím."],
  ocrLoad:      ["Không tải được bộ đọc chữ.", " Kiểm tra mạng (Wi‑Fi/4G) rồi bấm “Dịch chữ trong ảnh” lại."],

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch { voices = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// Chấm điểm giọng đọc: đúng vùng (vd. Anh-Anh) trước, rồi ưu tiên giọng chất lượng cao
function pickVoice(code) {
  const norm = (s) => (s || "").toLowerCase().replace("_", "-");
  const want = code.toLowerCase(), base = want.split("-")[0];
  let best = null, bestScore = 0;
  for (const v of voices) {
    const l = norm(v.lang);
    let s = l === want ? 10 : l.startsWith(base) ? 4 : 0;
    if (!s) continue;
    const n = (v.name || "").toLowerCase();
    if (/natural|neural|online/.test(n)) s += 4;
    if (/google/.test(n)) s += 3;
    if (/enhanced|premium/.test(n)) s += 3;
    if (!v.localService) s += 1;
    if (s > bestScore) { best = v; bestScore = s; }
  }
  return best;
}
// Danh sách giọng đọc có thể chưa tải xong: chờ tối đa 1,2 giây
function waitVoices() {
  if (voices.length) return Promise.resolve();
  return new Promise(res => {
    const t = setTimeout(res, 1200);
    try { speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); loadVoices(); res(); }, { once: true }); } catch { res(); }
  });
}
async function speak(text, lang) {
  if (!("speechSynthesis" in window)) { showVoiceMissing(lang); return; }
  try {
    speechSynthesis.cancel();
    loadVoices();
    await waitVoices();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang.code;
    const v = pickVoice(lang.code);
    if (v) u.voice = v; else if (voices.length) showVoiceMissing(lang);
    u.rate = rate;
    speechSynthesis.speak(u);
  } catch { showVoiceMissing(lang); }
}

function startListening(src) {
  const btn = side === "me" ? $("meBtn") : $("guestBtn");
  try {
    recog = new SR();
    recog.lang = src.code;
    recog.interimResults = true;
    recog.continuous = false;
    let failed = false;
    btn.classList.add("listening");
    recog.onresult = (e) => {
      let txt = "";
      for (const r of e.results) txt += r[0].transcript;
      $("input").value = txt.trim();
    };
    recog.onerror = (e) => {
      failed = true;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") { micBlocked = true; showError("micDenied"); }
      else if (e.error === "audio-capture") { micBlocked = true; showError("micNone"); }
      else if (e.error === "no-speech") showError("micNoSpeech");
      else if (e.error === "network") showError("offline");
      else if (e.error === "language-not-supported") showError("micNoLang");
      else if (e.error !== "aborted") showError("micOther");
      $("composerHint").textContent = keyboardHint();
    };
    recog.onend = () => {
      btn.classList.remove("listening");
      recog = null;
      if (!failed && $("input").value.trim()) doTranslate();
      else if (!failed) $("composerHint").textContent = keyboardHint();
    };
    recog.start();
  } catch {
    btn.classList.remove("listening");
    micBlocked = true;
    showError("micNone");
    $("composerHint").textContent = keyboardHint();
    $("input").focus();
  }
}
function stopListening() {
  try { recog && recog.abort(); } catch {}
  recog = null;
  document.querySelectorAll(".listening").forEach(b => b.classList.remove("listening"));
}

// ---------- Dịch (dịch vụ miễn phí, có dự phòng) ----------
async function gtx(text, from, to) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" +
    encodeURIComponent(from) + "&tl=" + encodeURIComponent(to) + "&q=" + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error("google " + r.status);
  const data = await r.json();
  const out = (data[0] || []).map(p => p[0]).join("").trim();
  if (!out) throw new Error("google empty");
  return { out, detected: typeof data[2] === "string" ? data[2] : from };
}
// Chia văn bản dài (vd. chữ trong ảnh) thành nhiều đoạn ngắn để dịch
function chunks(text, max = 1200) {
  const parts = [];
  let cur = "";
  for (const line of text.split("\n")) {
    let l = line;
    while (l.length > max) { if (cur) { parts.push(cur); cur = ""; } parts.push(l.slice(0, max)); l = l.slice(max); }
    if (cur && (cur + "\n" + l).length > max) { parts.push(cur); cur = l; }
    else cur = cur ? cur + "\n" + l : l;
  }
  if (cur) parts.push(cur);
  return parts;
}
async function translateGoogle(text, from, to) {
  const outs = [];
  let detected = from;
  for (const part of chunks(text)) {
    const r = await gtx(part, from, to);
    outs.push(r.out);
    if (detected === "auto") detected = r.detected;
  }
  return { out: outs.join("\n"), detected };
}
async function translateMyMemory(text, from, to) {
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
    "&langpair=" + encodeURIComponent(from + "|" + to);
  const r = await fetch(url);
  if (!r.ok) throw new Error("mymemory " + r.status);
  const data = await r.json();
  const out = data && data.responseData && data.responseData.translatedText;
  if (!out || data.responseStatus !== 200) throw new Error("mymemory bad");
  return { out: out.trim(), detected: from };
}
// from = "auto" để tự nhận tiếng; hint = tiếng đoán trước, dùng khi phải chuyển sang dịch vụ dự phòng
async function translate(text, from, to, hint) {
  try { return await translateGoogle(text, from, to); }
  catch { return await translateMyMemory(text.slice(0, 500), from === "auto" ? hint : from, to); }
}

function langByCode(tr) {
  if (!tr) return null;
  if (other.tr === tr) return other;
  const base = tr.split("-")[0];
  return LANGS.find(l => l.tr === tr) || LANGS.find(l => l.tr.split("-")[0] === base) || null;
}
function setOther(l) {
  other = l;
  store.set("pd-lang2", l.code);
  applyLang();
}
function showInfo(title, fix) {
  $("noticeTitle").textContent = title;
  $("noticeFix").textContent = fix;
  $("notice").hidden = false;
}
function startTurn(t) {
  for (let i = turns.length - 1; i >= 0; i--) if (turns[i].example) turns.splice(i, 1);
  turns.push(t);
  render();
  return t;
}

async function doTranslate() {
  const text = $("input").value.trim();
  if (!text) { showError("empty"); return; }
  if (!navigator.onLine) { showError("offline"); return; }
  const turn = startTurn({ side, lang: other, src: text, dst: "" });
  $("composer").hidden = true;
  if (!(await runTranslation(turn, side))) {
    turns.splice(turns.indexOf(turn), 1);
    $("input").value = text;
    $("composer").hidden = false;
    render();
  }
}

// Dịch một lượt. Khi bật "Tự nhận tiếng": tiếng Việt → dịch sang tiếng của khách,
// tiếng khác → dịch sang tiếng Việt và tự đổi ô chọn sang tiếng vừa nhận ra.
async function runTranslation(turn, who) {
  busy = true; $("translateBtn").disabled = true;
  clearError();
  try {
    let switched = null;
    if (autoDetect) {
      let res = await translate(turn.src, "auto", "vi", who === "me" ? "vi" : other.tr);
      if ((res.detected || "").split("-")[0] === "vi") {
        turn.side = "me";
        res = await translate(turn.src, "vi", other.tr);
      } else {
        turn.side = "guest";
        const found = langByCode(res.detected);
        if (found && found !== other) { setOther(found); switched = found; }
      }
      turn.lang = other;
      turn.dst = res.out;
    } else {
      turn.side = who;
      const from = who === "me" ? VI : other;
      turn.dst = (await translate(turn.src, from.tr, (who === "me" ? other : VI).tr)).out;
    }
    const to = turn.side === "me" ? other : VI;
    render();
    if (switched) showInfo("Đã tự nhận ra: " + switched.vi + ".", " Khi bạn nói, app sẽ dịch sang " + switched.vi + ".");
    if (autoSpeak) speak(turn.dst, to);
    if (turn.side === "me" && !turn.img) openShow(turn.dst, to);
    return true;
  } catch {
    showError(navigator.onLine ? "translate" : "offline");
    return false;
  } finally {
    busy = false; $("translateBtn").disabled = false;
  }
}

// ---------- Dịch chữ trong ảnh (đọc chữ ngay trên máy, miễn phí) ----------
const OCR = { en: "eng", "zh-CN": "chi_sim", "zh-TW": "chi_tra", yue: "chi_tra", ja: "jpn", ko: "kor", th: "tha", lo: "lao", km: "khm", fr: "fra", de: "deu", es: "spa", ru: "rus", it: "ita", pt: "por", id: "ind", ms: "msa", tl: "tgl", hi: "hin", ar: "ara", my: "mya", bn: "ben", ur: "urd", ta: "tam", te: "tel", pa: "pan", si: "sin", ne: "nep", mn: "mon", kk: "kaz", uz: "uzb", tr: "tur", fa: "fas", iw: "heb", az: "aze", ka: "kat", hy: "hye", nl: "nld", pl: "pol", uk: "ukr", cs: "ces", sk: "slk", hu: "hun", ro: "ron", bg: "bul", sr: "srp", hr: "hrv", el: "ell", sv: "swe", no: "nor", da: "dan", fi: "fin", sw: "swa" };
let tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoading) tessLoading = new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = ok;
    s.onerror = () => { tessLoading = null; bad(new Error("load")); };
    document.head.append(s);
  });
  return tessLoading;
}
function updateStatus(turn) {
  const el = $("log").querySelectorAll(".turn .dst")[turns.indexOf(turn)];
  if (el && !turn.dst) el.textContent = turn.status;
}
// Làm rõ ảnh trước khi đọc: đưa về cỡ vừa, chuyển trắng đen, tăng tương phản
async function prepareImage(file) {
  const bmp = await createImageBitmap(file);
  const long = Math.max(bmp.width, bmp.height);
  const scale = long > 1800 ? 1800 / long : long < 1000 ? 1000 / long : 1;
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  const g = c.getContext("2d");
  g.drawImage(bmp, 0, 0, c.width, c.height);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  let min = 255, max = 0;
  for (let i = 0; i < d.length; i += 4) {
    const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = y;
    if (y < min) min = y;
    if (y > max) max = y;
  }
  const span = Math.max(1, max - min);
  for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = (d[i] - min) * 255 / span;
  g.putImageData(img, 0, 0);
  return c;
}
// Chỉ giữ các dòng đọc chắc chắn; điểm càng cao nghĩa là đọc càng rõ
function scoreText(data) {
  const lines = (data.lines || [])
    .map(l => ({ t: l.text.trim().replace(/([぀-鿿가-힯])\s+(?=[぀-鿿가-힯])/g, "$1"), c: l.confidence }))
    .filter(l => l.c >= 60 && /[\p{L}\p{N}]{2,}/u.test(l.t.replace(/\s/g, "")));
  const len = lines.reduce((s, l) => s + l.t.length, 0);
  const score = lines.reduce((s, l) => s + l.c * l.t.length, 0);
  return { text: lines.map(l => l.t).join("\n"), score, avg: len ? score / len : 0, raw: !!(data.text || "").trim() };
}
$("photoBtn").onclick = () => { if (!busy) $("photoInput").click(); };
$("photoInput").onchange = async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (!navigator.onLine) { showError("offline"); return; }
  stopListening();
  $("composer").hidden = true;
  clearError();
  const turn = startTurn({ side: "guest", lang: other, src: "", dst: "", img: URL.createObjectURL(file), status: "Đang làm rõ ảnh…" });
  busy = true;
  let best = null;
  try {
    const canvas = await prepareImage(file);
    turn.status = "Đang tải bộ đọc chữ (lần đầu hơi lâu)…";
    updateStatus(turn);
    await loadTesseract();
    // Tự phát hiện: thử chữ Latin, Trung, Nhật, Hàn và tiếng đang chọn; chọn kết quả rõ nhất
    const mine = OCR[other.tr] || "eng";
    const sets = autoDetect ? [["eng", "vie"], ["chi_sim"], ["jpn"], ["kor"], [mine]] : [[mine, "vie"]];
    const seen = new Set(), uniq = [];
    for (const s of sets) { const u = [...new Set(s)], k = u.join("+"); if (!seen.has(k)) { seen.add(k); uniq.push(u); } }
    let step = 0;
    const worker = await Tesseract.createWorker(uniq[0], 1, {
      logger: (m) => {
        if (m.status === "recognizing text") turn.status = "Đang đọc chữ trong ảnh… " + Math.round((step + m.progress) / uniq.length * 100) + "%";
        else if (/load/.test(m.status)) turn.status = "Đang tải bộ đọc chữ (lần đầu hơi lâu)…";
        updateStatus(turn);
      },
    });
    for (let i = 0; i < uniq.length; i++) {
      step = i;
      if (i > 0) await worker.reinitialize(uniq[i]);
      const { data } = await worker.recognize(canvas);
      const r = scoreText(data);
      if (!best || r.score > best.score) best = r;
      if (best.avg >= 88 && best.text.length >= 4) break;
    }
    await worker.terminate();
  } catch (err) {
    busy = false;
    turns.splice(turns.indexOf(turn), 1);
    render();
    showError(err && err.message === "load" ? "ocrLoad" : "ocrFail");
    return;
  }
  busy = false;
  if (!best || best.text.length < 2) {
    turns.splice(turns.indexOf(turn), 1);
    render();
    showError(best && best.raw ? "ocrUnclear" : "ocrEmpty");
    return;
  }
  turn.src = best.text;
  turn.status = "Đang dịch…";
  render();
  if (!(await runTranslation(turn, "guest"))) { turn.status = "Chưa dịch được."; render(); }
};

window.addEventListener("offline", () => showError("offline"));
window.addEventListener("online", clearError);

// ---------- Tốc độ đọc ----------
let rate = parseFloat(store.get("pd-rate", "0.75")) || 0.75;
function renderSpeed() {
  for (const b of $("speed").querySelectorAll("button")) b.setAttribute("aria-pressed", String(parseFloat(b.dataset.rate) === rate));
}
for (const b of $("speed").querySelectorAll("button")) {
  b.onclick = () => {
    rate = parseFloat(b.dataset.rate);
    store.set("pd-rate", String(rate));
    renderSpeed();
    // Đọc lại câu dịch gần nhất để nghe thử tốc độ mới
    const last = [...turns].reverse().find(t => t.dst);
    if (last) speak(last.dst, last.side === "me" ? last.lang : VI);
  };
}
renderSpeed();

// ---------- Xin quyền micro ----------
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
function micDeniedHelp() {
  return isIOS
    ? " Vào Cài đặt › Safari › Micro › chọn Cho phép, rồi mở lại app."
    : " Bấm biểu tượng ổ khoá (hoặc ⋮ › Thông tin trang) cạnh địa chỉ web › Quyền › bật Micro, rồi tải lại trang.";
}
ERR.micDenied[1] = micDeniedHelp();
async function micState() {
  try { return (await navigator.permissions.query({ name: "microphone" })).state; } catch { return "unknown"; }
}
async function requestMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "unsupported";
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    return "granted";
  } catch (e) {
    return e && (e.name === "NotAllowedError" || e.name === "SecurityError") ? "denied" : "error";
  }
}
function showMicDenied() {
  $("micCard").hidden = false;
  $("micText").textContent = "Micro đang bị chặn." + micDeniedHelp();
  $("micAllow").textContent = "Thử lại";
}
async function refreshMicCard() {
  const st = await micState();
  if (st === "granted") { $("micCard").hidden = true; micBlocked = false; }
  else if (st === "denied") showMicDenied();
  else $("micCard").hidden = false;
}
$("micAllow").onclick = async () => {
  const r = await requestMic();
  if (r === "granted") { $("micCard").hidden = true; micBlocked = false; clearError(); }
  else if (r === "denied") showMicDenied();
  else showError("micNone");
};
refreshMicCard();

// Câu ví dụ (tự xoá khi dịch câu đầu tiên)
turns.push(
  { side: "me", lang: LANGS[0], src: "Xin chào, cho tôi hỏi nhà ga ở đâu?", dst: "Hello, could you tell me where the train station is?", example: true },
  { side: "guest", lang: LANGS[0], src: "Go straight two blocks, then turn left.", dst: "Đi thẳng hai dãy nhà, rồi rẽ trái.", example: true },
);
fillLangs(); applyLang(); renderAuto(); renderDetect(); render();
